<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#8B5CF6" /> <!-- Purple -->
    </linearGradient>
  </defs>
  
  <!-- Backdrop circle with gradient -->
  <rect width="32" height="32" rx="8" fill="url(#logo-grad)" />
  
  <!-- Stylized brain / network showing sentiment flow -->
  <!-- Left node (Negative/Blue) -->
  <circle cx="10" cy="19" r="2.5" fill="#FFFFFF" opacity="0.9" />
  <!-- Center node (Neutral/Purple) -->
  <circle cx="16" cy="11" r="3.5" fill="#FFFFFF" />
  <!-- Right node (Positive/Pink) -->
  <circle cx="22" cy="19" r="2.5" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Connections -->
  <line x1="10" y1="19" x2="16" y2="11" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <line x1="22" y1="19" x2="16" y2="11" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  <line x1="10" y1="19" x2="22" y2="19" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="1 1" opacity="0.4" />
  
  <!-- Sentiment smile curve inside the brain connection -->
  <path d="M 12 17 A 4 4 0 0 0 20 17" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
